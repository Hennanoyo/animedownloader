name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
      - "refactor/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          version: 11.26.0
          runtime: node@24.21.0
          working-directory: web
          install: false
          cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Type check
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

  backend:
    name: Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --all-packages --locked

      - name: Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Pyright
        run: uv run pyright

      - name: Pytest
        run: uv run pytest

  integration:
    name: Integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate Docker Compose configuration
        run: docker compose config

      - name: Validate Dev Container Compose configuration
        run: docker compose -f compose.yaml -f .devcontainer/docker-compose.devcontainer.yml config

      - name: Build Dev Container
        run: docker compose -f compose.yaml -f .devcontainer/docker-compose.devcontainer.yml build dev

      - name: Start runtime stack
        run: docker compose up -d --build

      - name: Wait for API
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:8000/api/health; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --no-color --tail=100 api
          exit 1

      - name: Wait for frontend
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:5173/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --no-color --tail=100 web
          exit 1

      - name: Verify runtime services
        run: docker compose ps

      - name: Stop runtime stack
        if: always()
        run: docker compose down --volumes
