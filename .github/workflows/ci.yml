name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
      - "refactor/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    if: ${{ hashFiles('web/package.json') != '' }}
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v1
        with:
          version: latest
          runtime: node@24

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Type check
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

  backend:
    name: Backend
    if: ${{ hashFiles('server/**/pyproject.toml') != '' }}
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup uv
        uses: astral-sh/setup-uv@v10

      - name: Install Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Pyright
        run: uv run pyright

      - name: Pytest
        run: uv run pytest

  integration:
    name: Integration
    if: ${{ hashFiles('compose.yaml') != '' || hashFiles('docker-compose.yml') != '' || hashFiles('docker-compose.yaml') != '' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate Docker Compose configuration
        run: docker compose config

      # Service startup and integration tests will be added when the
      # repository's Compose services and health checks are implemented.
