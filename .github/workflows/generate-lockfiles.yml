name: Generate Lockfiles

on:
  push:
    branches:
      - "feature/bootstrap"

permissions:
  contents: write

jobs:
  generate:
    name: Generate lockfiles
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          version: 11.26.0
          runtime: node@24.21.0
          working-directory: web
          install: false
          cache: false

      - name: Generate pnpm lockfile
        working-directory: web
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Generate uv lockfile
        working-directory: server
        run: uv lock

      - name: Commit lockfiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/pnpm-lock.yaml server/uv.lock
          if git diff --cached --quiet; then
            echo "Lockfiles are already up to date."
          else
            git commit -m "chore: add workspace lockfiles"
            git push
          fi
