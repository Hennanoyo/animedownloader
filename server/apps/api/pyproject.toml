[project]
name = "animedownloader-api"
version = "0.1.0"
description = "AnimeDownloader FastAPI application"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.17,<2",
    "animedownloader-anime",
    "animedownloader-config",
    "animedownloader-database",
    "animedownloader-download",
    "animedownloader-media-processing",
    "animedownloader-nyaa",
    "animedownloader-releases",
    "animedownloader-qbittorrent",
    "fastapi[standard]>=0.141,<0.142",
    "taskiq>=0.12,<0.13",
    "taskiq-redis>=1.2,<1.3",
]

[tool.uv.sources]
animedownloader-anime = { workspace = true }
animedownloader-config = { workspace = true }
animedownloader-database = { workspace = true }
animedownloader-download = { workspace = true }
animedownloader-media-processing = { workspace = true }
animedownloader-nyaa = { workspace = true }
animedownloader-releases = { workspace = true }
animedownloader-qbittorrent = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.17,<0.13"]
build-backend = "uv_build"
