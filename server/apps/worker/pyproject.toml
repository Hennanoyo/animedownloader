[project]
name = "animedownloader-worker"
version = "0.1.0"
description = "AnimeDownloader Taskiq worker"
requires-python = ">=3.14"
dependencies = [
    "animedownloader-config",
    "taskiq>=0.12,<0.13",
    "taskiq-redis>=1.2,<1.3",
]

[tool.uv.sources]
animedownloader-config = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.17,<0.13"]
build-backend = "uv_build"
