[project]
name = "animedownloader-worker"
version = "0.1.0"
description = "AnimeDownloader Taskiq worker"
requires-python = ">=3.14"
dependencies = [
    "animedownloader-api",
    "animedownloader-config",
    "animedownloader-download",
    "animedownloader-media",
    "animedownloader-media-asset",
    "animedownloader-media-processing",
    "animedownloader-qbittorrent",
    "animedownloader-storage",
    "animedownloader-torrent",
    "taskiq>=0.12,<0.13",
    "taskiq-redis>=1.2,<1.3",
]

[tool.uv.sources]
animedownloader-api = { workspace = true }
animedownloader-config = { workspace = true }
animedownloader-download = { workspace = true }
animedownloader-media = { workspace = true }
animedownloader-media-asset = { workspace = true }
animedownloader-media-processing = { workspace = true }
animedownloader-qbittorrent = { workspace = true }
animedownloader-storage = { workspace = true }
animedownloader-torrent = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.17,<0.13"]
build-backend = "uv_build"
