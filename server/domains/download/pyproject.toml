[project]
name = "animedownloader-download"
version = "0.1.0"
description = "Download job domain"
requires-python = ">=3.14"
dependencies = [
    "animedownloader-anime",
    "animedownloader-database",
]

[tool.uv.sources]
animedownloader-anime = { workspace = true }
animedownloader-database = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.17,<0.13"]
build-backend = "uv_build"
