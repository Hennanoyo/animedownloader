[project]
name = "animedownloader-media-asset"
version = "0.1.0"
description = "Media asset domain"
requires-python = ">=3.14"
dependencies = [
    "animedownloader-database",
    "animedownloader-media",
]

[tool.uv.sources]
animedownloader-database = { workspace = true }
animedownloader-media = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.17,<0.13"]
build-backend = "uv_build"
