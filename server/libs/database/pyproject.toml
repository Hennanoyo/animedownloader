[project]
name = "animedownloader-database"
version = "0.1.0"
description = "Async SQLAlchemy database infrastructure"
requires-python = ">=3.14"
dependencies = [
    "asyncpg>=0.30,<1",
    "sqlalchemy[asyncio]>=2.0,<3",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13"]
build-backend = "uv_build"
