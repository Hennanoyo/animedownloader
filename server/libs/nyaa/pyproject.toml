[project]
name = "animedownloader-nyaa"
version = "0.1.0"
description = "AnimeDownloader Nyaa RSS client"
requires-python = ">=3.14"
dependencies = [
    "animedownloader-releases",
    "defusedxml>=0.7.1,<1",
    "httpx>=0.28,<1",
]

[tool.uv.sources]
animedownloader-releases = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.17,<0.13"]
build-backend = "uv_build"
