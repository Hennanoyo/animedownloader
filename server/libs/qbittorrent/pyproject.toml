[project]
name = "animedownloader-qbittorrent"
version = "0.1.0"
description = "qBittorrent Web API adapter"
requires-python = ">=3.14"
dependencies = [
    "animedownloader-torrent",
    "httpx>=0.28,<1",
]

[tool.uv.sources]
animedownloader-torrent = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.17,<0.13"]
build-backend = "uv_build"
