[project]
name = "animedownloader-server"
version = "0.1.0"
description = "AnimeDownloader backend workspace"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pyright>=1.1.405,<2",
    "pytest>=8.4,<9",
    "ruff>=0.13,<1",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "apps/*",
    "domains/*",
    "libs/*",
]

[tool.pyright]
include = ["apps", "domains", "libs", "tests"]
exclude = [
    "**/__pycache__",
    ".venv",
]
pythonVersion = "3.14"
typeCheckingMode = "strict"
executionEnvironments = [
    { root = ".", extraPaths = [
        "apps/api/src",
        "domains/anime/src",
        "domains/download/src",
        "domains/releases/src",
        "libs/config/src",
        "libs/database/src",
        "libs/media/src",
        "libs/nyaa/src",
        "libs/qbittorrent/src",
        "libs/torrent/src",
    ] },
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
